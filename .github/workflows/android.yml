name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted Android runners already include the SDK and build tools.
      # Keeping this workflow independent of the setup-android action makes it
      # resilient to action runtime changes while Gradle accepts the runner SDK.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: set -o pipefail; gradle testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee unit-test.log

      - name: Build debug APK
        run: set -o pipefail; gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Publish Gradle diagnostics
        if: always()
        run: |
          for log in unit-test.log assemble.log; do
            if [ -f "$log" ]; then
              {
                echo "### $log"
                echo '```text'
                tail -80 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw-build-diagnostics
          path: |
            unit-test.log
            assemble.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nw-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
