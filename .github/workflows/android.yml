name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the built APKs as a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analyze
        run: |
          set +e
          flutter analyze > /tmp/analyze_output.txt 2>&1
          code=$?
          cat /tmp/analyze_output.txt
          if [ $code -ne 0 ]; then
            while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::${esc}"
            done < /tmp/analyze_output.txt
          fi
          exit $code

      - name: Run tests
        run: |
          set +e
          flutter test --reporter expanded > /tmp/test_output.txt 2>&1
          code=$?
          cat /tmp/test_output.txt
          if [ $code -ne 0 ]; then
            awk '/\[E\]/{capture=20} capture>0{print; capture--}' /tmp/test_output.txt > /tmp/test_failures.txt
            if [ ! -s /tmp/test_failures.txt ]; then
              tail -n 60 /tmp/test_output.txt > /tmp/test_failures.txt
            fi
            while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g')
              echo "::error::${esc}"
            done < /tmp/test_failures.txt
          fi
          exit $code

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o /tmp/gradle-bootstrap.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q /tmp/gradle-bootstrap.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --distribution-type all
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned)
        run: flutter build apk --release

      - name: Build split per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tsundoku-apks-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APKs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tsundoku build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: true
