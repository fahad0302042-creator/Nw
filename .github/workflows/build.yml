name: Build & Test
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Resolve dependencies (JitPack resilience)
        shell: bash
        run: |
          # JitPack intermittently 404s commit-pinned artifacts while it rebuilds them;
          # prime resolution with retries so later steps use the warmed cache.
          for i in 1 2 3; do
            if ./gradlew :app:dependencies --configuration debugCompileClasspath --console=plain -q > /dev/null 2>&1; then
              echo "dependencies resolved on attempt $i"
              exit 0
            fi
            echo "resolve attempt $i failed; waiting 60s for JitPack to rebuild..."
            sleep 60
          done
          echo "could not resolve dependencies after 3 attempts"
          exit 1

      - name: Check code format
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./gradlew spotlessCheck --console=plain > format.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "format ok"
            exit 0
          fi
          grep -aE "ktlint|\.kt|lint violation|Rule.*violation" format.log | head -50 | sed 's/::/  /g' | \
            while IFS= read -r line; do echo "::error::$line"; done
          {
            echo "## Format check failed (spotlessCheck)"
            echo ''
            echo "```"
            grep -aE -B1 -A3 "ktlint|violation|\.kt" format.log | head -100
            echo "```"
          } > fmt.md
          ISSUE_NUM=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'in:title "CI build log"' --limit 1 --json number --jq '.[0].number? // empty')
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM=$(gh issue create --repo "${{ github.repository }}" \
              --title "CI build log (auto-posted on failures)" \
              --body "Gradle logs from failed CI runs." \
              --json number --jq '.number')
          fi
          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body-file fmt.md || true
          fi
          exit $rc

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build app
        run: ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
