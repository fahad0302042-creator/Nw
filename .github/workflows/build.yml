name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Run tests
        run: flutter test --no-pub

      - name: Generate android project
        run: bash tool/prepare_android.sh

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Surface build failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          path = "/tmp/build.log"
          text = open(path).read() if os.path.exists(path) else "no build log captured"
          # Keep the interesting part: gradle prints the reason near the end.
          tail = text[-7000:]
          esc = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build failed::{esc}")
          PY

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/kuroyomi-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuroyomi-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling nightly release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="nightly"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk \
            --title "Kuroyomi nightly" \
            --notes "Automatic build of \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.

          Install on Android: download the APK below, then allow \"install unknown apps\" when prompted." \
            --prerelease \
            --target "$GITHUB_SHA"
