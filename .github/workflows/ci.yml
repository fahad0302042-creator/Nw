name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets CI post failure output back as a commit comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the JS side needs no SDK at all.
  extensions:
    name: Extension bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every extension bundle
        run: |
          for f in extensions_repo/src/*/index.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Validate repository index
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          idx = json.load(open('extensions_repo/index.json'))
          assert idx.get('extensions'), 'no extensions listed'
          bad = []
          for e in idx['extensions']:
              for key in ('id', 'name', 'version', 'lang', 'type', 'code'):
                  if not e.get(key):
                      bad.append(f"{e.get('id', '?')}: missing {key}")
              if e.get('type') not in ('manga', 'anime'):
                  bad.append(f"{e.get('id')}: bad type {e.get('type')}")
              p = pathlib.Path('extensions_repo') / e.get('code', '')
              if not p.exists():
                  bad.append(f"{e.get('id')}: code missing at {p}")
          if bad:
              sys.exit('\n'.join(bad))
          print(f"OK: {len(idx['extensions'])} extensions")
          PY

      - name: Check the JS prelude parses
        run: |
          python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path('lib/extensions/js_prelude.dart').read_text()
          m = re.search(r"const String kJsPrelude = r'''(.*?)''';", src, re.S)
          assert m, 'could not extract kJsPrelude'
          pathlib.Path('/tmp/prelude.js').write_text(m.group(1))
          print(f'extracted {len(m.group(1))} chars')
          PY
          node --check /tmp/prelude.js

      - name: Extension runtime contract test
        run: node tool/test_runtime.js

  flutter:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate the Android platform folder
        run: bash tool/bootstrap.sh
        env:
          ORG: com.kurayomi

      - name: Confirm bootstrap restored our sources
        run: |
          grep -q 'KurayomiApp' lib/main.dart \
            || { echo "::error::flutter create clobbered lib/main.dart"; exit 1; }
          grep -q 'flutter_inappwebview' pubspec.yaml \
            || { echo "::error::flutter create clobbered pubspec.yaml"; exit 1; }
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::manifest was not patched"; exit 1; }
          echo "bootstrap output verified"

      # Each step tees to a log and records its own outcome, so a failure
      # never hides the steps after it. The report step at the end surfaces
      # everything at once.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Unit tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log

      - name: Build debug APK
        id: apk
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          A: ${{ steps.analyze.outcome }}
          T: ${{ steps.tests.outcome }}
          B: ${{ steps.apk.outcome }}
        run: |
          icon() { if [ "$1" = success ]; then echo ':white_check_mark:'; else echo ':x:'; fi; }

          {
            echo "## Kurayomi CI"
            echo
            echo "commit \`${{ github.sha }}\`"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            printf '| Analyze | %s %s |\n'    "$(icon "$A")" "$A"
            printf '| Unit tests | %s %s |\n' "$(icon "$T")" "$T"
            printf '| Debug APK | %s %s |\n'  "$(icon "$B")" "$B"
            echo
          } > report.md

          for pair in "Analyze:analyze.log" "Unit tests:test.log" "Build:build.log"; do
            name="${pair%%:*}"
            file="${pair##*:}"
            [ -f "$file" ] || continue
            {
              echo "<details><summary>$name (last 200 lines)</summary>"
              echo
              echo '```'
              tail -n 200 "$file"
              echo '```'
              echo
              echo '</details>'
              echo
            } >> report.md
          done

          cat report.md >> "$GITHUB_STEP_SUMMARY" || true

          # Action log archives sit on blob storage that some networks cannot
          # reach, so the result is mirrored to a commit comment over plain
          # REST. Posted unconditionally: a green run is worth confirming too.
          jq -Rs '{body: .}' report.md > payload.json
          gh api -X POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --input payload.json >/dev/null \
            && echo "report posted as a commit comment" \
            || echo "could not post commit comment (continuing)"

          if [ "$A" = success ] && [ "$T" = success ] && [ "$B" = success ]; then
            echo "all green"
          else
            echo "::error::analyze=$A tests=$T apk=$B"
            exit 1
          fi

      - name: Upload APK
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kurayomi-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            analyze.log
            test.log
            build.log
            report.md
          if-no-files-found: ignore
