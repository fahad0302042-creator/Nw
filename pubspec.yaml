name: kurayomi
description: A Flutter manga & anime reader with a JavaScript extension runtime.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Extension runtime (QuickJS)
  flutter_js: ^0.8.1

  # Networking / parsing
  dio: ^5.5.0
  html: ^0.15.4

  # Storage
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Media
  cached_network_image: ^3.4.0
  photo_view: ^0.15.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Misc
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
