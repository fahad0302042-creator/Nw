name: tsundoku
description: A minimal, open-source manga & anime reader for Android with support for installable extensions (à la Tachiyomi/Mihon/Kotatsu).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  html: ^0.15.4
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  video_player: ^2.9.1
  chewie: ^1.8.1
  provider: ^6.1.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/extensions/
